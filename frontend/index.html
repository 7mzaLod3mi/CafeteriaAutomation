<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0B">
  <title>Giriş Yap · Yemekhane Otomasyonu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body class="giris-govde">
  <main class="kapsayici">
    <div class="giris-sarici">
      <div class="giris-baslik">
        <div class="tabak-vitrin">
          <img src="/img/tabak-hero.svg" alt="Yemek tabağı">
        </div>
        <span class="ust-etiket">Kampüs Yemekhanesi</span>
        <h1>Hoş <em>Geldiniz</em></h1>
        <p>Menüleri inceleyin, rezervasyon yapın, bakiyenizi yönetin.</p>
      </div>

      <section class="giris-kart">
        <p id="giris-bildirim" class="bildirim gizli"></p>

        <form id="giris-formu" novalidate>
          <div class="form-grup">
            <label for="eposta">E-posta</label>
            <input id="eposta" name="eposta" type="email" autocomplete="username" placeholder="ad.soyad@kampus.edu.tr" required>
          </div>

          <div class="form-grup">
            <label for="sifre">Şifre</label>
            <input id="sifre" name="sifre" type="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>

          <button id="giris-btn" type="submit" class="dugme dugme-tam">Giriş Yap</button>
        </form>
      </section>

      <details class="demo-hesaplar">
        <summary>Test hesapları (şifre: Yemek2026!)</summary>
        <button type="button" class="demo-hesap-btn" data-eposta="mehmet.yildiz@ogr.kampus.edu.tr">
          <span><strong>Öğrenci</strong><small>mehmet.yildiz@ogr.kampus.edu.tr</small></span>
          <span>Doldur</span>
        </button>
        <button type="button" class="demo-hesap-btn" data-eposta="ayse.demir@ogr.kampus.edu.tr">
          <span><strong>Öğrenci · düşük bakiye</strong><small>ayse.demir@ogr.kampus.edu.tr</small></span>
          <span>Doldur</span>
        </button>
        <button type="button" class="demo-hesap-btn" data-eposta="murat.kaya@kampus.edu.tr">
          <span><strong>Personel</strong><small>murat.kaya@kampus.edu.tr</small></span>
          <span>Doldur</span>
        </button>
        <button type="button" class="demo-hesap-btn" data-eposta="leyla.arslan@kampus.edu.tr">
          <span><strong>Yönetici</strong><small>leyla.arslan@kampus.edu.tr</small></span>
          <span>Doldur</span>
        </button>
      </details>
    </div>
  </main>

  <script src="/js/ortak.js"></script>
  <script src="/js/giris.js"></script>
</body>
</html>
